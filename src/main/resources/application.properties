spring.application.name=splitledger-api
server.port=${PORT:8080}
server.forward-headers-strategy=native

# Default database: H2 stored in ./data (zero setup). Use the "postgres" profile for PostgreSQL.
spring.datasource.url=jdbc:h2:file:./data/splitledger;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# Rate limiting (per client IP, fixed one-minute window)
app.rate-limit.requests-per-minute=120

# Seeds a demo group on first start so GET endpoints show data immediately
app.seed-demo=${SEED_DEMO:true}
